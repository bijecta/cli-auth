name: CI

# Pull requests run once via pull_request; push runs only for main (post-merge).
# Other branches can be run on demand with workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels its superseded run; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Bijecta.CliAuth.slnx --locked-mode
      - name: Build
        run: dotnet build Bijecta.CliAuth.slnx --configuration Release --no-restore
      - name: Build .NET fixture helper
        run: dotnet build samples/keycloak/fixture.cs --configuration Release
      - name: Test
        run: dotnet test --solution Bijecta.CliAuth.slnx --configuration Release --no-build
      - name: Check formatting
        run: dotnet format Bijecta.CliAuth.slnx --verify-no-changes --no-restore

  native-aot:
    name: Native AOT publish and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native toolchain prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # IsAotCompatible and PublishAot add SDK-versioned and runtime-specific lock entries, so these
      # restores are not locked; the build job keeps locked restore. Trim/AOT warnings are errors.
      - name: Analyze every library for trim and AOT compatibility
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet build "$project" --configuration Release -p:IsAotCompatible=true
          done
      - name: Publish the sample with Native AOT
        run: dotnet publish samples/Bijecta.CliAuth.Sample.Cli/Bijecta.CliAuth.Sample.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true --output artifacts/aot
      # Exercises native locking, private-directory creation, record reads, and JSON output offline.
      - name: Smoke-test the native binary
        run: |
          set -euo pipefail
          exe=artifacts/aot/bijecta-auth
          dir="$(cygpath -m "$RUNNER_TEMP" 2> /dev/null || echo "$RUNNER_TEMP")/aot-store"
          args=(--issuer https://login.example.test/realms/demo --client-id sample-cli --storage-dir "$dir")
          expect() { local pattern=$1; shift; local out; out=$("$exe" "$@" "${args[@]}"); echo "$out"; grep -qF "$pattern" <<< "$out"; }
          expect '"profile":"personal","status":{"kind":"None"}' list --profile work --profile personal
          expect '"kind":"None"' status --profile work
          # Token acquisition without a session must fail with ReauthenticationRequired (exit code 3).
          set +e; "$exe" token --profile work "${args[@]}" 2> "$dir/../token.err"; code=$?; set -e
          cat "$dir/../token.err"
          [ "$code" -eq 3 ] && grep -qF '"errorCode":"ReauthenticationRequired"' "$dir/../token.err"
          key=$(basename "$(ls "$dir"/*.lock | head -n 1)" .lock)
          (umask 077; printf '{"broken' > "$dir/$key.json")
          expect '"error":"StorageCorrupt"' list --profile work --profile personal
          expect '"localSessionRemoved":true' logout --profile work
          expect '"localSessionRemoved":true' logout --profile personal
          if compgen -G "$dir/*.json" > /dev/null; then echo "Session records remain after logout."; exit 1; fi

  browser-integration:
    name: Keycloak browser and device integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked integration dependencies
        run: dotnet restore Bijecta.CliAuth.IntegrationTests.slnx --locked-mode
      - name: Build integration tests
        run: dotnet build Bijecta.CliAuth.IntegrationTests.slnx --configuration Release --no-restore
      - name: Install Playwright Chromium and system dependencies
        run: pwsh tests/Bijecta.CliAuth.KeycloakTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test against disposable Keycloak
        run: dotnet test --solution Bijecta.CliAuth.IntegrationTests.slnx --configuration Release --no-build
      - name: Check integration formatting
        run: dotnet format Bijecta.CliAuth.IntegrationTests.slnx --verify-no-changes --no-restore
