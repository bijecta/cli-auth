name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Bijecta.CliAuth.slnx --locked-mode
      - name: Build
        run: dotnet build Bijecta.CliAuth.slnx --configuration Release --no-restore
      - name: Build .NET fixture helper
        run: dotnet build samples/keycloak/fixture.cs --configuration Release
      - name: Test
        run: dotnet test --solution Bijecta.CliAuth.slnx --configuration Release --no-build
      - name: Check formatting
        run: dotnet format Bijecta.CliAuth.slnx --verify-no-changes --no-restore

  browser-integration:
    name: Keycloak browser integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked integration dependencies
        run: dotnet restore Bijecta.CliAuth.IntegrationTests.slnx --locked-mode
      - name: Build integration tests
        run: dotnet build Bijecta.CliAuth.IntegrationTests.slnx --configuration Release --no-restore
      - name: Install Playwright Chromium and system dependencies
        run: pwsh tests/Bijecta.CliAuth.KeycloakTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test against disposable Keycloak
        run: dotnet test --solution Bijecta.CliAuth.IntegrationTests.slnx --configuration Release --no-build
      - name: Check integration formatting
        run: dotnet format Bijecta.CliAuth.IntegrationTests.slnx --verify-no-changes --no-restore
