name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Bijecta.CliAuth.slnx --locked-mode
      - name: Build
        run: dotnet build Bijecta.CliAuth.slnx --configuration Release --no-restore
      - name: Build .NET fixture helper
        run: dotnet build samples/keycloak/fixture.cs --configuration Release
      - name: Test
        run: dotnet test --solution Bijecta.CliAuth.slnx --configuration Release --no-build
      - name: Check formatting
        run: dotnet format Bijecta.CliAuth.slnx --verify-no-changes --no-restore
