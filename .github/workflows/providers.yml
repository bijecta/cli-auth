name: Hosted providers

# Real logins against hosted OAuth/OIDC providers (ADR 0010). Never runs on pull requests: fork PRs get no
# secrets, and external providers are too flaky for a required check. Each provider phase maps its secrets below
# and adds its name to the default required list.
on:
  workflow_dispatch:
    inputs:
      required-providers:
        description: Comma-separated provider names whose tests must run (missing secrets fail instead of skipping).
        required: false
        default: "Auth0,Entra"
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]

# One run per provider set at a time, so two runs never share a tenant's test user; runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.required-providers || 'Auth0,Entra' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  providers:
    name: Hosted provider integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Provider secrets live in this environment; its deployment-branch rules decide which refs may use them.
    environment: providers
    env:
      # Scheduled and push runs have no inputs: every hosted provider is required there.
      CLIAUTH_REQUIRED_PROVIDERS: ${{ inputs.required-providers || 'Auth0,Entra' }}
      CLIAUTH_AUTH0_ISSUER: ${{ secrets.CLIAUTH_AUTH0_ISSUER }}
      CLIAUTH_AUTH0_CLIENT_ID: ${{ secrets.CLIAUTH_AUTH0_CLIENT_ID }}
      CLIAUTH_AUTH0_DEVICE_CLIENT_ID: ${{ secrets.CLIAUTH_AUTH0_DEVICE_CLIENT_ID }}
      CLIAUTH_AUTH0_USERNAME: ${{ secrets.CLIAUTH_AUTH0_USERNAME }}
      CLIAUTH_AUTH0_PASSWORD: ${{ secrets.CLIAUTH_AUTH0_PASSWORD }}
      # The registered loopback callback port (docs/providers/auth0.md); not a secret.
      CLIAUTH_AUTH0_CALLBACK_PORT: "43823"
      CLIAUTH_ENTRA_ISSUER: ${{ secrets.CLIAUTH_ENTRA_ISSUER }}
      CLIAUTH_ENTRA_CLIENT_ID: ${{ secrets.CLIAUTH_ENTRA_CLIENT_ID }}
      CLIAUTH_ENTRA_DEVICE_CLIENT_ID: ${{ secrets.CLIAUTH_ENTRA_DEVICE_CLIENT_ID }}
      CLIAUTH_ENTRA_USERNAME: ${{ secrets.CLIAUTH_ENTRA_USERNAME }}
      CLIAUTH_ENTRA_PASSWORD: ${{ secrets.CLIAUTH_ENTRA_PASSWORD }}
      # Entra ignores the loopback port (docs/providers/entra.md); fixed only to match Auth0. Not a secret.
      CLIAUTH_ENTRA_CALLBACK_PORT: "43823"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked integration dependencies
        run: dotnet restore Bijecta.CliAuth.IntegrationTests.slnx --locked-mode
      - name: Build integration tests
        run: dotnet build Bijecta.CliAuth.IntegrationTests.slnx --configuration Release --no-restore
      - name: Install Playwright Chromium and system dependencies
        run: pwsh tests/Bijecta.CliAuth.ProviderTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test against hosted providers
        run: dotnet test --project tests/Bijecta.CliAuth.ProviderTests/Bijecta.CliAuth.ProviderTests.csproj --configuration Release --no-build
