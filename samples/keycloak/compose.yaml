services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--hostname", "http://127.0.0.1:8080"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .local/keycloak.env
    volumes:
      - ./.local/realm.json:/opt/keycloak/data/import/cliauth-realm.json:ro
